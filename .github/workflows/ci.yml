name: F01 Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: F01 regression (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: 检出项目
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装固定版本 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: "false"

      - name: 安装项目指定的 Python
        run: |
          $pythonVersion = (Get-Content -LiteralPath .python-version -Raw).Trim()
          uv --cache-dir .uv-cache python install $pythonVersion

      - name: 执行统一回归检查
        run: uv --cache-dir .uv-cache run --locked python scripts/check.py

      # 仅上传检查报告，不上传实际任务材料、凭据或全部 workspace。
      - name: 保存检查报告
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f01-regression-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace/checks/**/*.json
            workspace/checks/**/*.xml
            workspace/checks/**/*.txt
          if-no-files-found: warn
          retention-days: 14
